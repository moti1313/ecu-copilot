# Optional monitoring overlay: Prometheus scrapes the Copilot's /metrics/prometheus, Grafana shows a provisioned dashboard.
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (anonymous viewer; admin/admin for edits)
#   Ports taken? PROMETHEUS_PORT=9091 GRAFANA_PORT=3001 docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Tracing stays in Jaeger; this overlay answers "how fast, how often failing, how expensive, is everything up" over time.
services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
