[project]
name = "ecu-copilot"
version = "0.1.0"
description = "Agent + RAG copilot over a digital twin of an EOL test line for door control units"
readme = "README.md"
authors = [
    { name = "Morteza Molaei", email = "m.molaei@ostfalia.de" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ecu_copilot/copilot/agent.py" = ["E501"]  # the system prompt reads better as long lines
"evals/run.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
