# Scrapes the Copilot's Prometheus exposition (see src/ecu_copilot/copilot/metrics.py::prometheus_text).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: copilot
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["copilot:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
